services:
  postgres:
    image: postgres:17-alpine
    container_name: work-on-object-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: construction_journal
      POSTGRES_USER: journal_user
      POSTGRES_PASSWORD: journal_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_user -d construction_journal"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    container_name: work-on-object-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://journal_user:journal_password@postgres:5432/construction_journal?schema=public
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
