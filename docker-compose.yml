services:
  postgres:
    image: postgres:17-alpine
    container_name: work-on-object-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: construction_journal
      POSTGRES_USER: journal_user
      POSTGRES_PASSWORD: journal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_user -d construction_journal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
